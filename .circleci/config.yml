version: 2
jobs:
  build:
    working_directory: ~/aaront/puckdb
    parallelism: 1
    shell: /bin/bash --login
    environment:
      CIRCLE_ARTIFACTS: /tmp/circleci-artifacts
      CIRCLE_TEST_REPORTS: /tmp/circleci-test-results
      PUCKDB_DB_HOST: 127.0.0.1
      PUCKDB_DB_PORT: 5432
      PUCKDB_DB_TEST_DATABASE: circle_test
      PUCKDB_DB_USER: root
    docker:
    - image: circleci/python:3.7-rc-stretch
      environment:
        PIPENV_VENV_IN_PROJECT: true
    - image: circleci/postgres:9.6.2
      environment:
        POSTGRES_USER: root
        POSTGRES_DB: circle_test
    steps:
    - checkout
    - run: sudo chown -R circleci:circleci /usr/local/bin
    - run: sudo chown -R circleci:circleci /usr/local/lib/python3.7/site-packages
    - run: 
        name: Creating artifacts directory
        command: mkdir -p $CIRCLE_ARTIFACTS $CIRCLE_TEST_REPORTS
    - restore_cache:
        key: v1-dep-{{ .Branch }}-{{ checksum "Pipfile.lock" }}
    - run:
        name: Installing Python dependencies
        command: |
            sudo pip install pipenv
            pipenv install -d
    - save_cache:
        key: v1-dep-{{ .Branch }}-{{ checksum "Pipfile.lock" }}
        paths:
            - ".venv"
            - "/usr/local/bin"
            - "/usr/local/lib/python3.7/site-packages"
    - run:
        name: Running tests
        command: |
          PIPENV_DONT_LOAD_ENV=1 pipenv run py.test --cov-config .coveragerc --cov-report xml:$CIRCLE_TEST_REPORTS/coverage.xml --cov puckdb --junitxml $CIRCLE_TEST_REPORTS/test-results.xml tests/
    - run: 
        name: Uploading code coverage results
        command: bash <(curl -s https://codecov.io/bash)
    - store_test_results:
        path: /tmp/circleci-test-results
    - store_artifacts:
        path: /tmp/circleci-artifacts
    - store_artifacts:
        path: /tmp/circleci-test-results
